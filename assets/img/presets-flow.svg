<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" font-family="system-ui, sans-serif" font-size="13">
  <title>プリセットの受け渡し：オーナーがスマホで選び、Actions がコミットし、PC の Claude Code は pull で受け取る</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f1f3f5; stroke: #495057; }
    .line { stroke: #adb5bd; stroke-dasharray: 4 4; }
    .msg { stroke: #1c7ed6; fill: none; }
    .head { fill: #1c7ed6; }
    text { fill: #212529; }
    .note { fill: #495057; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1e1e1e; }
      .box { fill: #2b2f33; stroke: #ced4da; }
      .line { stroke: #6c757d; }
      .msg { stroke: #74c0fc; }
      .head { fill: #74c0fc; }
      text { fill: #e9ecef; }
      .note { fill: #ced4da; }
    }
  </style>
  <rect class="bg" width="640" height="360" rx="8"/>

  <!-- 登場するもの -->
  <rect class="box" x="20" y="16" width="120" height="44" rx="6"/>
  <text x="80" y="35" text-anchor="middle">オーナー</text>
  <text x="80" y="52" text-anchor="middle" class="note">（スマホ）</text>
  <rect class="box" x="180" y="16" width="120" height="44" rx="6"/>
  <text x="240" y="35" text-anchor="middle">GitHub Actions</text>
  <text x="240" y="52" text-anchor="middle" class="note">（GitHub のサーバー）</text>
  <rect class="box" x="340" y="16" width="120" height="44" rx="6"/>
  <text x="400" y="35" text-anchor="middle">リポジトリ</text>
  <text x="400" y="52" text-anchor="middle" class="note">（GitHub の main）</text>
  <rect class="box" x="500" y="16" width="120" height="44" rx="6"/>
  <text x="560" y="35" text-anchor="middle">Claude Code</text>
  <text x="560" y="52" text-anchor="middle" class="note">（PC）</text>

  <line class="line" x1="80" y1="60" x2="80" y2="344"/>
  <line class="line" x1="240" y1="60" x2="240" y2="344"/>
  <line class="line" x1="400" y1="60" x2="400" y2="344"/>
  <line class="line" x1="560" y1="60" x2="560" y2="344"/>

  <!-- 1 -->
  <text x="160" y="96" text-anchor="middle">1. プリセットを選んで実行</text>
  <line class="msg" x1="80" y1="106" x2="232" y2="106"/>
  <path class="head" d="M240 106 l-9 -5 v10 z"/>

  <!-- 2 -->
  <text x="320" y="146" text-anchor="middle">2. 設定を書き換えてコミット</text>
  <line class="msg" x1="240" y1="156" x2="392" y2="156"/>
  <path class="head" d="M400 156 l-9 -5 v10 z"/>

  <!-- 3 -->
  <text x="320" y="196" text-anchor="middle">3.「pull して」と伝える</text>
  <line class="msg" x1="80" y1="206" x2="552" y2="206"/>
  <path class="head" d="M560 206 l-9 -5 v10 z"/>

  <!-- 4 -->
  <text x="480" y="246" text-anchor="middle">4. git pull</text>
  <line class="msg" x1="560" y1="256" x2="408" y2="256"/>
  <path class="head" d="M400 256 l9 -5 v10 z"/>

  <!-- 5 -->
  <text x="480" y="296" text-anchor="middle">5. 変更を受け取る</text>
  <line class="msg" x1="400" y1="306" x2="552" y2="306"/>
  <path class="head" d="M560 306 l-9 -5 v10 z"/>

  <text x="320" y="338" text-anchor="middle" class="note">Claude Code は設定ファイルを書かない。受け取るだけ</text>
</svg>
