# main に push されたら、テストしてからビルドし、GitHub Pages に公開する。
# リポジトリの Settings → Pages → Source を「GitHub Actions」にしておくこと。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 公開前チェック（check.mjs）を含む。固有の言葉の一覧は Secret の PRIVACY_WORDS に入れておくこと
      - run: npm test
        env:
          PRIVACY_WORDS: ${{ secrets.PRIVACY_WORDS }}
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - run: node build.mjs --base "${{ steps.pages.outputs.base_path || '' }}/" --origin "${{ steps.pages.outputs.origin || 'http://localhost:8080' }}"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
